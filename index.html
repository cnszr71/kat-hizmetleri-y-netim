<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123b35">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<title>Otel Ağaoğlu Housekeeping & Yönetim Sistemi</title>
<style>
:root {
  --green:#123b35; --green2:#1d5a4f; --bg:#f8faf9;
  --white:#fff; --text:#24332f; --muted:#71817b;
  --border:#e2ece8; --shadow:0 10px 30px rgba(18,59,53,0.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{background:var(--green);color:#fff;padding:20px 24px;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
.header-inner{max-width:1400px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,0.12);display:grid;place-items:center;font-size:24px}
h1{font-size:20px;margin:0 0 4px;font-weight:700;letter-spacing:-0.2px}
.subtitle{font-size:12px;color:#c9d9d4}
.header-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:600;transition:all 0.2s ease}
button:hover{opacity:0.9;transform:translateY(-1px)}
.btn-light{background:#fff;color:var(--green)}
.btn-green{background:var(--green2);color:#fff}
.btn-outline{background:#fff;color:var(--text);border:1px solid var(--border)}
.btn-danger{background:#fde8e7;color:#a72e2e}
main{max-width:1400px;margin:24px auto;padding:0 20px 40px}

/* GİRİŞ EKRANI (LOGIN OVERLAY) */
#loginOverlay {
  position: fixed; inset: 0; background: var(--green); z-index: 9999;
  display: flex; place-items: center; justify-content: center; padding: 20px;
}
.login-card {
  background: #fff; padding: 36px; border-radius: 20px; max-width: 420px; width: 100%;
  box-shadow: 0 20px 50px rgba(0,0,0,0.3); text-align: center;
}
.login-card h2 { margin-top: 0; color: var(--green); font-size: 24px; }
.login-card p { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
.login-field { margin-bottom: 16px; text-align: left; }
